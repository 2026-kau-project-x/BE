# Alembic config. DB URL is NOT here: it comes from DATABASE_URL via app/core/config.py (see migrations/env.py).
# Keep this file ASCII-only: Windows reads .ini with the cp949 codec.
[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os
# migration file name: 0001_create_trips.py
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
