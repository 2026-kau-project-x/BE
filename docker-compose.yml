# 로컬 통합 실행: BE(:8000) + AI(:8001). AI 리포가 BE 옆 폴더(../AI)에 clone 되어 있어야 한다.
#   docker compose up --build    →  http://localhost:8000/docs
# AI 는 외부에 포트를 열지 않고 compose 내부망으로만 BE 가 호출한다 (AWS 의 app-sg 구조와 동일).
services:
  be:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: sqlite:////data/projectx.db
      AI_SERVICE_URL: http://ai:8001
    volumes:
      - be-data:/data
    depends_on:
      - ai
  ai:
    build: ../AI
    expose:
      - "8001"

volumes:
  be-data:
